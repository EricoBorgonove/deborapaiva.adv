map "$status:$uri" $site_cache_control {
  default "no-store";
  ~*^(200|206|304):/assets/.*-[a-z0-9_-]{8}\.(css|js)$ "public, max-age=31536000, immutable";
  ~^(200|206|304):/assets/ "public, max-age=3600, must-revalidate";
  ~^(200|304): "no-cache";
}

# TLS is terminated by the trusted reverse proxy in production.
# Keep the container private; the proxy must overwrite X-Forwarded-Proto.
map "$https:$http_x_forwarded_proto" $site_hsts {
  default "";
  ~^on: "max-age=31536000";
  ":https" "max-age=31536000";
}

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Cache-Control $site_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security $site_hsts always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;

  location ~ ^/(data|sorteio|listagrande|listapequena|listaturma)(/|$|\.html$) {
    return 410;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  location = /robots.txt {
    types { }
    default_type text/plain;
    try_files $uri =404;
  }
  location = /sitemap.xml {
    types { }
    default_type application/xml;
    try_files $uri =404;
  }
  location /assets/ {
    try_files $uri =404;
  }
}
