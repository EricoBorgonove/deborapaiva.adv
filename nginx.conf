map "$status:$uri" $site_cache_control {
  default "no-store";
  ~*^(200|206|304):/assets/.*-[a-z0-9_-]{8}\.(css|js)$ "public, max-age=31536000, immutable";
  ~^(200|206|304):/assets/ "public, max-age=3600, must-revalidate";
  ~^(200|304): "no-cache";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Cache-Control $site_cache_control always;

  location ~ ^/(data|sorteio|listagrande|listapequena|listaturma)(/|$|\.html$) {
    return 410;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  location = /robots.txt {
    types { }
    default_type text/plain;
    try_files $uri =404;
  }
  location = /sitemap.xml {
    types { }
    default_type application/xml;
    try_files $uri =404;
  }
  location /assets/ {
    try_files $uri =404;
  }
}
